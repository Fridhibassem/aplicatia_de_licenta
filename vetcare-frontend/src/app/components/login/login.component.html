<div class="login-page">

  <!-- Panel stanga -->
  <div class="login-panel">
    <div class="panel-content">
      <div class="panel-logo">
        <div class="logo-icon"><i class="fa-solid fa-paw"></i></div>
        <span>VetCare</span>
      </div>
      <h2>Bine ai revenit!</h2>
      <p>Accesează contul tău pentru a gestiona programările și dosarul medical al animalului tău.</p>
      <div class="panel-features">
        <div class="feat" *ngFor="let f of features">
          <div class="feat-icon"><i [class]="f.icon"></i></div>
          <span>{{ f.text }}</span>
        </div>
      </div>
    </div>
    <div class="deco-paw deco-1">🐾</div>
    <div class="deco-paw deco-2">🐾</div>
    <div class="deco-paw deco-3">🐾</div>
  </div>

  <!-- Panel dreapta -->
  <div class="login-form-side">
    <div class="login-box">

      <div class="auth-tabs">
        <button class="tab-btn" [class.active]="tab==='login'"    (click)="tab='login'">Autentificare</button>
        <button class="tab-btn" [class.active]="tab==='register'" (click)="tab='register'">Cont Nou</button>
        <div class="tab-indicator" [class.right]="tab==='register'"></div>
      </div>

      <!-- LOGIN -->
      <div *ngIf="tab==='login'" class="auth-form fade-up">
        <h3 class="form-heading">Intră în cont</h3>
        <div class="error-msg" *ngIf="loginError">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ loginError }}
        </div>
        <div class="form-group">
          <label>Adresă Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" [(ngModel)]="login.email" name="lemail" placeholder="ana@email.com" />
          </div>
        </div>
        <div class="form-group">
          <label>Parolă <a href="#" class="forgot-link">Ai uitat parola?</a></label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input [type]="showPass ? 'text' : 'password'" [(ngModel)]="login.password" name="lpass" placeholder="••••••••" />
            <button type="button" class="pass-toggle" (click)="showPass=!showPass">
              <i [class]="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="login.remember" name="remember" />
          <span>Ține-mă minte</span>
        </label>
        <button class="btn btn-primary submit-btn" (click)="doLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> Autentifică-te
        </button>
        <div class="divider"><span>sau</span></div>
        <button class="btn-social">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20" />
          Continuă cu Google
        </button>
      </div>

      <!-- REGISTER -->
      <div *ngIf="tab==='register'" class="auth-form fade-up">
        <h3 class="form-heading">Creează un cont</h3>
        <div class="form-row-2">
          <div class="form-group">
            <label>Prenume</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user input-icon"></i>
              <input type="text" [(ngModel)]="reg.firstName" name="rfirst" placeholder="Ana" />
            </div>
          </div>
          <div class="form-group">
            <label>Nume</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user input-icon"></i>
              <input type="text" [(ngModel)]="reg.lastName" name="rlast" placeholder="Popescu" />
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" [(ngModel)]="reg.email" name="remail" placeholder="ana@email.com" />
          </div>
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <div class="input-wrap">
            <i class="fa-solid fa-phone input-icon"></i>
            <input type="text" autocomplete="off" [(ngModel)]="reg.phone" name="rphone" placeholder="+40 7xx xxx xxx" />
          </div>
        </div>
        <div class="form-group">
          <label>Parolă</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" [(ngModel)]="reg.password" name="rpass" placeholder="Min. 8 caractere" />
          </div>
        </div>
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="reg.agree" name="ragree" />
          <span>Sunt de acord cu <a href="#">Termenii și Condițiile</a></span>
        </label>
        <button class="btn btn-primary submit-btn" (click)="doRegister()">
          <i class="fa-solid fa-user-plus"></i> Creează Contul
        </button>
      </div>

    </div>
  </div>
</div>
